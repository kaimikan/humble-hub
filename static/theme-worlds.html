<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>theme worlds · lab</title>
<!--
  Theme-worlds LAB — a sandbox for prototyping hub "worlds" (palette + font +
  generative skin) BEFORE they graduate into static/themes.js + the live picker.
  Each draft is one entry in DRAFTS below: a palette + a sketch factory. Add a
  candidate by appending an entry; nothing here touches the live hub.
  Reuses /static/themes.js (for _hx + the shipped THEME palettes) and p5.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #161618; color: #d6d6d8;
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
  header.lab { padding: 1.4rem 1.4rem .4rem; }
  header.lab h1 { margin: 0; font-size: 1.15rem; font-weight: 600;
    font-variant: small-caps; letter-spacing: .12em; color: #efeff1; }
  header.lab p { margin: .35rem 0 0; color: #9a9aa0; font-size: .85rem; max-width: 60ch; }
  header.lab code { background: #26262a; padding: .05rem .35rem; border-radius: 3px; font-size: .82em; }

  .grid { display: grid; gap: 1.1rem; padding: 1.1rem 1.4rem 3rem;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }

  /* a tile is a small live "world": canvas behind, a sampler card floating over */
  .tile { position: relative; height: 300px; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.12); cursor: zoom-in;
    background: var(--bg); font-family: var(--font); }
  .tile canvas { position: absolute; inset: 0; display: block; z-index: 0; }
  .tile .ui { position: absolute; inset: 0; padding: .85rem; display: flex;
    flex-direction: column; gap: .6rem; pointer-events: none; z-index: 1; }
  .tile .badge { align-self: flex-start; font-size: .62rem; font-variant: small-caps;
    letter-spacing: .1em; padding: .12rem .5rem; border-radius: 999px;
    background: rgba(0,0,0,.35); color: #fff; }
  .tile[data-shipped] .badge { background: var(--verdigris); }

  /* mini project card — mirrors the real hub card so palette + type read true */
  .samp-card { background: var(--card-bg); border: 1px solid var(--ink-faint);
    border-radius: 4px; padding: .6rem .7rem; color: var(--ink); }
  .samp-card .ttl { font-weight: 600; font-size: .95rem; letter-spacing: .02em; }
  .samp-card .ex { font-style: italic; color: var(--ink-soft); font-size: .82rem;
    margin: .25rem 0 .5rem; }
  .samp-card .btns { display: flex; gap: .4rem; flex-wrap: wrap; }
  .samp-card button { font: inherit; font-size: .72rem; font-variant: small-caps;
    letter-spacing: .04em; padding: .22rem .6rem; border-radius: 2px; cursor: pointer;
    background: transparent; border: 1px solid currentColor; }
  .samp-card .b-open { color: var(--sanguine); }
  .samp-card .b-claude { color: var(--lapis); }
  .samp-card .b-files { color: var(--verdigris); }

  .samp-row { display: flex; align-items: center; gap: .6rem; margin-top: auto; }
  .dots { display: flex; gap: .3rem; }
  .dots span { width: .7rem; height: .7rem; border-radius: 50%; }
  /* tiny terminal swatch — terminals stay dark across every theme */
  .term { flex: 1; background: #0e120d; border: 1px solid rgba(255,255,255,.1);
    border-radius: 3px; padding: .2rem .4rem; font: .68rem/1.4 "JetBrains Mono", monospace;
    white-space: nowrap; overflow: hidden; }
  .term .g { color: var(--verdigris); } .term .b { color: var(--lapis); }
  .term .y { color: var(--ochre); } .term .f { color: var(--ink); }

  .name { font-family: var(--font); color: var(--ink); }
  .name b { font-weight: 600; letter-spacing: .03em; }
  .name span { color: var(--ink-soft); font-size: .8rem; }

  /* expand overlay */
  #x { position: fixed; inset: 0; z-index: 50; background: rgba(8,8,10,.9);
    display: none; align-items: center; justify-content: center; padding: 2.5vmin; }
  #x.on { display: flex; }
  #x .big { position: relative; width: min(900px, 96vw); height: min(620px, 88vh);
    border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.16);
    background: var(--bg); font-family: var(--font); }
  #x .big canvas { position: absolute; inset: 0; z-index: 0; }
  #x .big .ui { position: absolute; inset: 0; padding: 1.4rem; display: flex;
    flex-direction: column; gap: 1rem; pointer-events: none; z-index: 1; }
  #x .big .samp-card { max-width: 420px; }
  #x .close { position: fixed; top: 1rem; right: 1.2rem; width: 2.3rem; height: 2.3rem;
    border-radius: 50%; border: 0; background: rgba(0,0,0,.5); color: #fff;
    font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  @media (prefers-reduced-motion: reduce) { header.lab p::after {
    content: " · motion reduced (static previews)"; color: #c0a86a; } }
</style>
</head>
<body>
<header class="lab">
  <h1>theme worlds · lab</h1>
  <p>A sandbox for prototyping hub worlds before they graduate into
  <code>themes.js</code>. Tap a tile to expand. Nothing here is live — drafts
  ship to the real picker only once approved.</p>
</header>
<div class="grid" id="grid"></div>

<div id="x"><button class="close" id="x-close" title="close">✕</button><div class="big" id="x-big"></div></div>

<script src="/static/vendor/p5.min.js"></script>
<script src="/static/themes.js"></script>
<script>
"use strict";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- generative sketches (instance mode); each: (palette, container) => sketch
function softSprite(p, hex, coreA = 1) {
  const s = 64, g = p.createGraphics(s, s), c = g.drawingContext, [r, gg, b] = _hx(hex);
  const grad = c.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grad.addColorStop(0, `rgba(${r},${gg},${b},${coreA})`);
  grad.addColorStop(0.3, `rgba(${r},${gg},${b},${coreA*0.7})`);
  grad.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  c.fillStyle = grad; c.fillRect(0, 0, s, s);
  return g;
}
const dims = c => [c.clientWidth || 340, c.clientHeight || 300];

// OLD GROWTH (shipped) — warm light pool + faint shafts + slow dust motes
function makeGrove(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg), [amR, amG, amB] = _hx(pal.ochre);
  return (p) => {
    let motes = [], sprite, src;
    const N = () => Math.max(7, Math.min(16, Math.floor(p.width * p.height / 14000)));
    class Mote {
      constructor() { this.reset(true); }
      reset(i) { this.x = p.random(p.width); this.y = i ? p.random(p.height) : p.random(-20, p.height*0.4);
        this.r = p.random(1, 2.8); this.vx = p.random(.05,.22); this.vy = p.random(.04,.15);
        this.ph = p.random(p.TWO_PI); this.tw = p.random(.004,.011); this.base = p.random(.16,.46); }
      step() { this.x += this.vx + Math.sin(this.ph)*.05; this.y += this.vy; this.ph += this.tw;
        if (this.x > p.width+12 || this.y > p.height+12) this.reset(false); }
      draw() { const d = 1 - p.constrain(p.dist(this.x,this.y,src.x,src.y)/(p.width*.95),0,1);
        const a = this.base*(.35+.65*d)*(.72+.28*Math.sin(this.ph)), s = this.r*6;
        p.tint(255,255,255,a*255); p.image(sprite, this.x-s/2, this.y-s/2, s, s); }
    }
    const light = () => { const ctx = p.drawingContext;
      let g = ctx.createRadialGradient(src.x,src.y,0,src.x,src.y,p.width*.85);
      g.addColorStop(0,`rgba(${amR},${amG},${amB},.11)`); g.addColorStop(1,`rgba(${amR},${amG},${amB},0)`);
      ctx.fillStyle = g; ctx.fillRect(0,0,p.width,p.height);
      ctx.save(); ctx.translate(src.x,src.y); ctx.rotate(.6);
      for (const [a,w] of [[0,150],[.17,95],[-.15,115],[.32,70]]) { ctx.save(); ctx.rotate(a);
        const len = p.width*1.4, sg = ctx.createLinearGradient(0,0,0,len);
        sg.addColorStop(0,`rgba(${amR},${amG},${amB},.05)`); sg.addColorStop(1,`rgba(${amR},${amG},${amB},0)`);
        ctx.fillStyle = sg; ctx.fillRect(-w/2,0,w,len); ctx.restore(); } ctx.restore(); };
    const scene = (mv) => { p.background(bgR,bgG,bgB); p.push(); p.blendMode(p.ADD); light();
      for (const m of motes) { if (mv) m.step(); m.draw(); } p.pop(); };
    p.setup = () => { const [w,h] = dims(container); p.createCanvas(w,h).parent(container);
      p.pixelDensity(1); p.frameRate(30); sprite = softSprite(p, pal.ochre);
      src = p.createVector(p.width*.08, -p.height*.06);
      for (let i=0;i<N();i++) motes.push(new Mote()); if (REDUCED) { scene(false); p.noLoop(); } };
    p.draw = () => scene(true);
    p.windowResized = () => { const [w,h] = dims(container); p.resizeCanvas(w,h);
      src = p.createVector(p.width*.08, -p.height*.06); };
  };
}

// FIREFLIES — near-black wood; warm glowing drifters that blink (sharp pulse)
function makeFireflies(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg);
  return (p) => {
    let flies = [], sprite;
    const N = () => Math.max(6, Math.min(15, Math.floor(p.width * p.height / 12000)));
    class Fly {
      constructor() { this.reset(); }
      reset() { this.x = p.random(p.width); this.y = p.random(p.height); this.r = p.random(1.6,3.2);
        this.ang = p.random(p.TWO_PI); this.spd = p.random(.1,.35);
        this.ph = p.random(p.TWO_PI); this.bl = p.random(.012,.03); this.base = p.random(.55,1); }
      step() { this.ang += (p.noise(this.x*.01,this.y*.01,p.frameCount*.005)-.5)*.3;
        this.x += Math.cos(this.ang)*this.spd; this.y += Math.sin(this.ang)*this.spd; this.ph += this.bl;
        if (this.x<-10) this.x=p.width+10; if (this.x>p.width+10) this.x=-10;
        if (this.y<-10) this.y=p.height+10; if (this.y>p.height+10) this.y=-10; }
      draw() { let t = Math.sin(this.ph); t = t*t*t; const a = this.base*Math.max(0,t);
        if (a <= .002) return; const s = this.r*7; p.tint(255,255,255,a*255);
        p.image(sprite, this.x-s/2, this.y-s/2, s, s); }
    }
    const scene = (mv) => { p.background(bgR,bgG,bgB); p.push(); p.blendMode(p.ADD);
      for (const f of flies) { if (mv) f.step(); f.draw(); } p.pop(); };
    p.setup = () => { const [w,h] = dims(container); p.createCanvas(w,h).parent(container);
      p.pixelDensity(1); p.frameRate(30); sprite = softSprite(p, pal.glow || pal.ochre);
      for (let i=0;i<N();i++) flies.push(new Fly()); if (REDUCED) { scene(false); p.noLoop(); } };
    p.draw = () => scene(true);
    p.windowResized = () => { const [w,h] = dims(container); p.resizeCanvas(w,h); };
  };
}

// DAPPLED CANOPY — light theme; warm sun patches (screen) + leaf shadow (multiply) drift
function makeDappled(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg);
  return (p) => {
    let blobs = [];
    const mk = warm => ({ nx: p.random(1e3), ny: p.random(1e3), r: p.random(38,108),
      sp: p.random(.0006,.0017), warm });
    const paint = () => { const ctx = p.drawingContext;
      for (const b of blobs) { b.nx += b.sp; b.ny += b.sp;
        const x = p.noise(b.nx)*p.width, y = p.noise(b.ny)*p.height;
        const g = ctx.createRadialGradient(x,y,0,x,y,b.r);
        if (b.warm) { ctx.globalCompositeOperation = "screen";
          g.addColorStop(0,"rgba(255,243,198,.55)"); g.addColorStop(1,"rgba(255,243,198,0)"); }
        else { ctx.globalCompositeOperation = "multiply";
          g.addColorStop(0,"rgba(44,72,32,.42)"); g.addColorStop(1,"rgba(44,72,32,0)"); }
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,b.r,0,7); ctx.fill(); }
      ctx.globalCompositeOperation = "source-over"; };
    const scene = () => { p.background(bgR,bgG,bgB); paint(); };
    p.setup = () => { const [w,h] = dims(container); p.createCanvas(w,h).parent(container);
      p.pixelDensity(1); p.frameRate(24);
      for (let i=0;i<5;i++) blobs.push(mk(true)); for (let i=0;i<4;i++) blobs.push(mk(false));
      if (REDUCED) { scene(); p.noLoop(); } };
    p.draw = scene;
    p.windowResized = () => { const [w,h] = dims(container); p.resizeCanvas(w,h); };
  };
}

// UNDERSTORY — earthy floor; a few pale spores rising slowly (palette-forward, minimal)
function makeUnderstory(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg);
  return (p) => {
    let spores = [], sprite;
    const N = () => Math.max(4, Math.min(9, Math.floor(p.width * p.height / 22000)));
    class Spore {
      constructor() { this.reset(true); }
      reset(i) { this.x = p.random(p.width); this.y = i ? p.random(p.height) : p.height+10;
        this.r = p.random(1,2.3); this.vy = -p.random(.06,.16); this.drift = p.random(-.05,.05);
        this.ph = p.random(p.TWO_PI); this.tw = p.random(.005,.012); this.base = p.random(.12,.3); }
      step() { this.y += this.vy; this.x += this.drift + Math.sin(this.ph)*.04; this.ph += this.tw;
        if (this.y < -10) this.reset(false); }
      draw() { const a = this.base*(.7+.3*Math.sin(this.ph)), s = this.r*6;
        p.tint(255,255,255,a*255); p.image(sprite, this.x-s/2, this.y-s/2, s, s); }
    }
    const scene = (mv) => { p.background(bgR,bgG,bgB); p.push(); p.blendMode(p.ADD);
      for (const s of spores) { if (mv) s.step(); s.draw(); } p.pop(); };
    p.setup = () => { const [w,h] = dims(container); p.createCanvas(w,h).parent(container);
      p.pixelDensity(1); p.frameRate(24); sprite = softSprite(p, "#d8ccae");
      for (let i=0;i<N();i++) spores.push(new Spore()); if (REDUCED) { scene(false); p.noLoop(); } };
    p.draw = () => scene(true);
    p.windowResized = () => { const [w,h] = dims(container); p.resizeCanvas(w,h); };
  };
}

// STAR ATLAS — indigo night; twinkling stars, constellations that draw
// themselves, a rare shooting star for whoever happens to be looking
function makeAtlas(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg), [iR, iG, iB] = _hx(pal.ink);
  return (p) => {
    let stars = [], constel, shoot = null, tints;
    const N = () => Math.max(40, Math.min(110, Math.floor(p.width * p.height / 1400)));
    const mkStar = () => ({ x: p.random(p.width), y: p.random(p.height),
      r: p.random(.5, 1.6), ph: p.random(p.TWO_PI), tw: p.random(.008, .02),
      base: p.random(.25, .9), c: p.random() < .12 ? tints[(p.random(tints.length)) | 0] : null });
    const mkConstel = () => { const cx = p.random(p.width * .15, p.width * .85),
      cy = p.random(p.height * .2, p.height * .8), pts = [];
      const n = 4 + ((p.random(3)) | 0);
      for (let i = 0; i < n; i++) pts.push({ x: cx + p.random(-75, 75), y: cy + p.random(-55, 55) });
      return { pts, t: 0 }; };
    const drawConstel = (c) => { const seg = c.pts.length - 1;
      const alpha = c.t < .7 ? 1 : 1 - (c.t - .7) / .3;         // draw → hold → fade
      const prog = p.constrain(c.t / .35, 0, 1) * seg;
      p.stroke(iR, iG, iB, 52 * alpha); p.strokeWeight(.8);
      for (let i = 0; i < seg; i++) { const f = p.constrain(prog - i, 0, 1); if (f <= 0) break;
        const a = c.pts[i], b = c.pts[i + 1];
        p.line(a.x, a.y, a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f); }
      p.noStroke(); p.fill(iR, iG, iB, 150 * alpha);
      for (let i = 0; i <= Math.min(seg, Math.ceil(prog)); i++) p.circle(c.pts[i].x, c.pts[i].y, 2.4); };
    const scene = (mv) => { p.background(bgR, bgG, bgB); p.noStroke();
      for (const s of stars) { if (mv) s.ph += s.tw;
        const a = s.base * (.55 + .45 * Math.sin(s.ph));
        if (s.c) p.fill(s.c[0], s.c[1], s.c[2], a * 235); else p.fill(iR, iG, iB, a * 205);
        p.circle(s.x, s.y, s.r * 2); }
      if (mv) { constel.t += 1 / (30 * 14); if (constel.t > 1) constel = mkConstel(); }
      drawConstel(constel);
      if (mv && !shoot && p.random() < .0012)
        shoot = { x: p.random(p.width), y: p.random(p.height * .4), a: p.random(.5, 1.1), life: 1 };
      if (shoot) { const v = 9, dx = Math.cos(shoot.a) * v, dy = Math.sin(shoot.a) * v;
        p.stroke(iR, iG, iB, 190 * shoot.life); p.strokeWeight(1.4);
        p.line(shoot.x, shoot.y, shoot.x - dx * 4, shoot.y - dy * 4); p.noStroke();
        if (mv) { shoot.x += dx; shoot.y += dy; shoot.life -= .033; if (shoot.life <= 0) shoot = null; } } };
    p.setup = () => { const [w, h] = dims(container); p.createCanvas(w, h).parent(container);
      p.pixelDensity(1); p.frameRate(30);
      tints = [pal.lapis, pal.ochre, pal.sanguine].map(_hx);
      for (let i = 0; i < N(); i++) stars.push(mkStar()); constel = mkConstel();
      if (REDUCED) { constel.t = .5; scene(false); p.noLoop(); } };
    p.draw = () => scene(true);
    p.windowResized = () => { const [w, h] = dims(container); p.resizeCanvas(w, h); };
  };
}

// ABYSS — bioluminescent deep: dark until you move; plankton glows near the
// pointer, taps bloom. Light as interaction, darkness as the default.
function makeAbyss(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg);
  return (p) => {
    let motes = [], sprites, bloom = null;
    const N = () => Math.max(20, Math.min(60, Math.floor(p.width * p.height / 2600)));
    const mk = () => ({ x: p.random(p.width), y: p.random(p.height), r: p.random(1, 2.6),
      a: p.random(p.TWO_PI), spd: p.random(.06, .22), ph: p.random(p.TWO_PI),
      tw: p.random(.005, .014), s: (p.random(sprites.length)) | 0 });
    const lightAt = (x, y) => { let d = 1e9;
      if (p.mouseX > 0 && p.mouseX < p.width && p.mouseY > 0 && p.mouseY < p.height)
        d = p.dist(x, y, p.mouseX, p.mouseY);
      let l = Math.max(0, 1 - d / 180) ** 2;                     // pointer lantern
      if (bloom) l = Math.max(l, Math.max(0, 1 - p.dist(x, y, bloom.x, bloom.y) / bloom.r) * bloom.life);
      return l; };
    const scene = (mv) => { p.background(bgR, bgG, bgB); p.push(); p.blendMode(p.ADD);
      for (const m of motes) { if (mv) { m.a += (p.noise(m.x * .008, m.y * .008) - .5) * .2;
          m.x += Math.cos(m.a) * m.spd; m.y += Math.sin(m.a) * m.spd; m.ph += m.tw;
          if (m.x < -8) m.x = p.width + 8; if (m.x > p.width + 8) m.x = -8;
          if (m.y < -8) m.y = p.height + 8; if (m.y > p.height + 8) m.y = -8; }
        const a = .05 + .1 * Math.sin(m.ph) ** 2 + .85 * lightAt(m.x, m.y), s = m.r * 8;
        p.tint(255, 255, 255, p.constrain(a, 0, 1) * 255);
        p.image(sprites[m.s], m.x - s / 2, m.y - s / 2, s, s); }
      p.pop();
      if (bloom && mv) { bloom.r += 3.2; bloom.life -= .02; if (bloom.life <= 0) bloom = null; } };
    p.setup = () => { const [w, h] = dims(container); p.createCanvas(w, h).parent(container);
      p.pixelDensity(1); p.frameRate(30);
      sprites = [softSprite(p, pal.verdigris), softSprite(p, pal.lapis), softSprite(p, pal.glow || pal.verdigris)];
      for (let i = 0; i < N(); i++) motes.push(mk());
      if (REDUCED) { scene(false); p.noLoop(); } };
    p.draw = () => scene(true);
    p.mousePressed = () => { if (p.mouseX >= 0 && p.mouseX <= p.width && p.mouseY >= 0 && p.mouseY <= p.height)
      bloom = { x: p.mouseX, y: p.mouseY, r: 30, life: 1 }; };
    p.windowResized = () => { const [w, h] = dims(container); p.resizeCanvas(w, h); };
  };
}

// PHYSARUM — slime-mold agents lay pheromone trails on a coarse field that
// diffuses and decays: a living network slowly growing behind the shelf
function makePhysarum(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg), [tR, tG, tB] = _hx(pal.verdigris);
  return (p) => {
    const SCALE = 4, SENSE = 7, TURN = .42, STEP = 1.1;
    let W, H, field, next, agents, img;
    const N = () => Math.max(220, Math.min(600, Math.floor(p.width * p.height / 170)));
    const wrap = (v, m) => (v % m + m) % m;
    const at = (x, y) => field[wrap(y | 0, H) * W + wrap(x | 0, W)];
    const stepAgents = () => { for (const a of agents) {
        const l = at(a.x + Math.cos(a.a - .45) * SENSE, a.y + Math.sin(a.a - .45) * SENSE);
        const c = at(a.x + Math.cos(a.a) * SENSE, a.y + Math.sin(a.a) * SENSE);
        const r = at(a.x + Math.cos(a.a + .45) * SENSE, a.y + Math.sin(a.a + .45) * SENSE);
        if (c >= l && c >= r) ; else if (l > r) a.a -= TURN; else a.a += TURN;
        a.a += p.random(-.06, .06);            // jitter — keeps filaments fine
        a.x = wrap(a.x + Math.cos(a.a) * STEP, W); a.y = wrap(a.y + Math.sin(a.a) * STEP, H);
        const i = (a.y | 0) * W + (a.x | 0); field[i] = Math.min(1, field[i] + .11); } };
    const diffuse = () => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const x0 = x ? x - 1 : W - 1, x1 = x < W - 1 ? x + 1 : 0;
        const y0 = (y ? y - 1 : H - 1) * W, y1 = (y < H - 1 ? y + 1 : 0) * W, ym = y * W;
        next[ym + x] = (field[ym + x] * 4 + field[ym + x0] + field[ym + x1]
          + field[y0 + x] + field[y1 + x]) / 8 * .93; }
      [field, next] = [next, field]; };
    const paint = () => { img.loadPixels();
      for (let i = 0; i < W * H; i++) { const v = Math.min(1, field[i]) ** 1.6, k = i * 4;
        img.pixels[k] = bgR + (tR - bgR) * v; img.pixels[k + 1] = bgG + (tG - bgG) * v;
        img.pixels[k + 2] = bgB + (tB - bgB) * v; img.pixels[k + 3] = 255; }
      img.updatePixels(); p.image(img, 0, 0, p.width, p.height); };
    p.setup = () => { const [w, h] = dims(container); p.createCanvas(w, h).parent(container);
      p.pixelDensity(1); p.frameRate(30);
      W = Math.ceil(w / SCALE); H = Math.ceil(h / SCALE);
      field = new Float32Array(W * H); next = new Float32Array(W * H);
      agents = Array.from({ length: N() }, () => {  // seed as a loose ring — the
        const a = p.random(p.TWO_PI);               // net grows outward from home
        return { x: W / 2 + Math.cos(a) * p.random(W / 7), y: H / 2 + Math.sin(a) * p.random(H / 7),
          a: p.random(p.TWO_PI) }; });
      if (REDUCED) { for (let i = 0; i < 300; i++) { stepAgents(); diffuse(); }
        img = p.createImage(W, H); paint(); p.noLoop(); return; }
      img = p.createImage(W, H); };
    p.draw = () => { stepAgents(); diffuse(); paint(); };
    p.windowResized = () => { const [w, h] = dims(container); p.resizeCanvas(w, h); };
  };
}

// DARKROOM — everything under the red safelight; prints develop in the dark.
// The brave part is the palette: five pigments doing their jobs in ONE hue.
function makeDarkroom(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg);
  return (p) => {
    let prints = [], lampPh = 0;
    const mkPrint = () => ({ x: p.random(p.width * .08, p.width * .62),
      y: p.random(p.height * .1, p.height * .6), w: p.random(46, 86), t: p.random(-.4, 0),
      blobs: Array.from({ length: 3 + ((p.random(3)) | 0) },
        () => ({ dx: p.random(.15, .85), dy: p.random(.15, .85), r: p.random(.12, .34) })) });
    const lamp = () => { const ctx = p.drawingContext, breathe = .1 + .025 * Math.sin(lampPh);
      const g = ctx.createRadialGradient(p.width * .9, -p.height * .1, 0,
        p.width * .9, -p.height * .1, p.width * .95);
      g.addColorStop(0, `rgba(214,66,48,${breathe})`); g.addColorStop(1, "rgba(214,66,48,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, p.width, p.height); };
    const scene = (mv) => { p.background(bgR, bgG, bgB); if (mv) lampPh += .012; lamp();
      for (const pr of prints) { if (mv) pr.t += 1 / (30 * 16);
        if (pr.t > 1) Object.assign(pr, mkPrint());
        const dev = p.constrain(pr.t / .55, 0, 1);               // develop slowly…
        const a = pr.t < .82 ? dev : dev * (1 - (pr.t - .82) / .18);  // …then lift out
        if (a <= 0) continue; const h = pr.w * 1.28; p.noStroke();
        p.fill(30, 8, 7, 210 * a); p.rect(pr.x - 3, pr.y - 3, pr.w + 6, h + 6, 2); // paper edge
        p.fill(16, 4, 4, 235 * a); p.rect(pr.x, pr.y, pr.w, h, 1);
        for (const b of pr.blobs) { p.fill(120, 34, 26, 90 * a * dev);
          p.circle(pr.x + b.dx * pr.w, pr.y + b.dy * h, b.r * pr.w * 2); } } };
    p.setup = () => { const [w, h] = dims(container); p.createCanvas(w, h).parent(container);
      p.pixelDensity(1); p.frameRate(24);
      for (let i = 0; i < 3; i++) { const pr = mkPrint(); pr.t = p.random(.1, .8); prints.push(pr); }
      if (REDUCED) { scene(false); p.noLoop(); } };
    p.draw = () => scene(true);
    p.windowResized = () => { const [w, h] = dims(container); p.resizeCanvas(w, h); };
  };
}

// RAIN ON THE WINDOW — lamplight bokeh behind wet glass; drops bead, then run
function makeRain(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg);
  return (p) => {
    let bokeh = [], runners = [], beads = [], sprites;
    const mkBokeh = () => ({ x: p.random(p.width), y: p.random(p.height * .75),
      r: p.random(18, 52), a: p.random(.05, .16), s: (p.random(sprites.length)) | 0,
      ph: p.random(p.TWO_PI) });
    const mkRunner = () => ({ x: p.random(p.width), y: p.random(-p.height * .3, 0),
      v: p.random(1.2, 2.6), wob: p.random(p.TWO_PI) });
    const mkBead = () => ({ x: p.random(p.width), y: p.random(p.height),
      r: p.random(.7, 1.8), ph: p.random(p.TWO_PI) });
    const scene = (mv) => { p.background(bgR, bgG, bgB, mv ? 46 : 255);  // veil → streak trails
      p.push(); p.blendMode(p.ADD);
      for (const b of bokeh) { if (mv) b.ph += .006;
        const s = b.r * (1 + .04 * Math.sin(b.ph));
        p.tint(255, 255, 255, b.a * 255); p.image(sprites[b.s], b.x - s, b.y - s, s * 2, s * 2); }
      p.pop(); p.noStroke();
      for (const d of beads) { if (mv) d.ph += .01;
        p.fill(210, 224, 238, 46 + 26 * Math.sin(d.ph)); p.circle(d.x, d.y, d.r * 2); }
      for (const r of runners) { if (mv) { r.wob += .12;
          r.x += Math.sin(r.wob) * .5; r.y += r.v; r.v += .015;
          if (r.y > p.height + 8) Object.assign(r, mkRunner()); }
        p.fill(224, 236, 248, 150); p.circle(r.x, r.y, 2.6);
        p.fill(224, 236, 248, 60); p.circle(r.x, r.y - 4, 1.8); } };
    p.setup = () => { const [w, h] = dims(container); p.createCanvas(w, h).parent(container);
      p.pixelDensity(1); p.frameRate(30);
      sprites = [pal.lapis, pal.ochre, pal.sanguine, pal.glow || pal.ochre].map(c => softSprite(p, c, .8));
      const nb = Math.max(5, Math.min(11, (p.width * p.height / 14000) | 0));
      for (let i = 0; i < nb; i++) bokeh.push(mkBokeh());
      for (let i = 0; i < Math.max(4, p.width / 90 | 0); i++) runners.push(mkRunner());
      for (let i = 0; i < 26; i++) beads.push(mkBead());
      p.background(bgR, bgG, bgB); if (REDUCED) { scene(false); p.noLoop(); } };
    p.draw = () => scene(true);
    p.windowResized = () => { const [w, h] = dims(container); p.resizeCanvas(w, h);
      p.background(bgR, bgG, bgB); };
  };
}

// UKIYO-E — washi paper, an indigo wave band with foam curls, a sparse petal
// drift, one vermilion seal. Lives or dies on restraint.
function makeUkiyo(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg), [wR, wG, wB] = _hx(pal.lapis), [sR, sG, sB] = _hx(pal.sanguine);
  return (p) => {
    let petals = [], ph = 0;
    const mkPetal = (init) => ({ x: p.random(p.width), y: init ? p.random(p.height) : -8,
      r: p.random(2.4, 4.2), rot: p.random(p.TWO_PI), vr: p.random(-.02, .02),
      vy: p.random(.25, .55), sway: p.random(p.TWO_PI), sw: p.random(.008, .02) });
    const wave = () => { const baseY = p.height * .82;
      for (let L = 0; L < 3; L++) { const yo = L * 9, amp = 7 - L * 1.6;
        p.noFill(); p.stroke(wR, wG, wB, 200 - L * 48); p.strokeWeight(2.2 - L * .5);
        p.beginShape(); for (let x = -6; x <= p.width + 6; x += 7)
          p.vertex(x, baseY + yo + Math.sin(x * .045 + ph + L * .7) * amp); p.endShape(); }
      p.noStroke(); p.fill(bgR, bgG, bgB, 255);                  // paper under the crests
      for (let x = 10; x < p.width; x += 34) {                   // foam curls on the top line
        const y = p.height * .82 + Math.sin(x * .045 + ph) * 7;
        p.fill(wR, wG, wB, 170); p.circle(x, y - 3, 5); p.fill(bgR, bgG, bgB); p.circle(x - 1.4, y - 4.2, 3.4); } };
    const seal = () => { p.noStroke(); p.fill(sR, sG, sB, 235);
      p.rect(p.width - 34, p.height * .18, 18, 18, 2); p.fill(bgR, bgG, bgB, 200);
      p.rect(p.width - 30, p.height * .18 + 4, 4, 10); p.rect(p.width - 24, p.height * .18 + 4, 4, 6); };
    const scene = (mv) => { p.background(bgR, bgG, bgB); if (mv) ph += .006; wave(); seal();
      p.noStroke(); for (const pt of petals) { if (mv) { pt.sway += pt.sw; pt.rot += pt.vr;
          pt.x += Math.sin(pt.sway) * .45; pt.y += pt.vy;
          if (pt.y > p.height + 8) Object.assign(pt, mkPetal(false)); }
        p.push(); p.translate(pt.x, pt.y); p.rotate(pt.rot);
        p.fill(224, 170, 184, 200); p.ellipse(0, 0, pt.r * 2, pt.r * 1.15); p.pop(); } };
    p.setup = () => { const [w, h] = dims(container); p.createCanvas(w, h).parent(container);
      p.pixelDensity(1); p.frameRate(30);
      const n = Math.max(4, Math.min(8, (p.width / 70) | 0));
      for (let i = 0; i < n; i++) petals.push(mkPetal(true));
      if (REDUCED) { scene(false); p.noLoop(); } };
    p.draw = () => scene(true);
    p.windowResized = () => { const [w, h] = dims(container); p.resizeCanvas(w, h); };
  };
}

// BLISS (Windows XP) — the wallpaper as a living sketch: gradient sky, rolling
// green hill, cumulus drifting by. Joke-world lineage (geocities, aqua) — if it
// graduates, the SKIN adds the Luna chrome (blue titlebars, green Start button).
function makeBliss(pal, container) {
  return (p) => {
    let clouds = [], sprite;
    const mkCloud = (init) => { const puffs = [], n = 3 + ((p.random(3)) | 0);
      for (let i = 0; i < n; i++) puffs.push({ dx: p.random(-1.1, 1.1), dy: p.random(-.35, .3),
        r: p.random(.5, 1) });
      return { x: init ? p.random(-40, p.width) : -60, y: p.random(p.height * .06, p.height * .42),
        s: p.random(22, 44), v: p.random(.12, .3), puffs }; };
    const sky = () => { const ctx = p.drawingContext;
      const g = ctx.createLinearGradient(0, 0, 0, p.height * .8);
      g.addColorStop(0, "#3d7edb"); g.addColorStop(.6, "#7fb2ec"); g.addColorStop(1, "#cfe3f8");
      ctx.fillStyle = g; ctx.fillRect(0, 0, p.width, p.height); };
    const hill = () => { const ctx = p.drawingContext, hy = p.height * .74;
      const g = ctx.createLinearGradient(0, hy - 40, 0, p.height);
      g.addColorStop(0, "#8ed04e"); g.addColorStop(.45, "#57ab30"); g.addColorStop(1, "#2f7a1e");
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, p.height);
      ctx.lineTo(0, hy + 18);
      ctx.bezierCurveTo(p.width * .3, hy - 34, p.width * .62, hy - 10, p.width, hy + 26);
      ctx.lineTo(p.width, p.height); ctx.closePath(); ctx.fill();
      const s = ctx.createRadialGradient(p.width * .34, hy - 16, 0, p.width * .34, hy - 16, p.width * .5);
      s.addColorStop(0, "rgba(255,255,230,.2)"); s.addColorStop(1, "rgba(255,255,230,0)");
      ctx.fillStyle = s; ctx.fillRect(0, hy - 60, p.width, p.height - hy + 60); };
    const scene = (mv) => { sky();
      for (const c of clouds) { if (mv) { c.x += c.v; if (c.x - c.s * 2.4 > p.width) Object.assign(c, mkCloud(false)); }
        for (const pf of c.puffs) { const s = c.s * pf.r * 2.6;
          p.tint(255, 255, 255, 235); p.image(sprite, c.x + pf.dx * c.s - s / 2, c.y + pf.dy * c.s - s / 2, s, s); } }
      hill(); };
    p.setup = () => { const [w, h] = dims(container); p.createCanvas(w, h).parent(container);
      p.pixelDensity(1); p.frameRate(30); sprite = softSprite(p, "#ffffff", .9);
      const n = Math.max(3, Math.min(6, (p.width / 110) | 0));
      for (let i = 0; i < n; i++) clouds.push(mkCloud(true));
      if (REDUCED) { scene(false); p.noLoop(); } };
    p.draw = () => scene(true);
    p.windowResized = () => { const [w, h] = dims(container); p.resizeCanvas(w, h); };
  };
}

// WIN95 — teal desktop, and THE move: the Solitaire win animation. Cards
// bounce across the desktop stamping trails (no clear — that IS the effect),
// then the table resets for a new deal.
function makeWin95(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg);
  return (p) => {
    let cards = [], resetAt = 0;
    const SUITS = [["♠", [26, 26, 26]], ["♥", [178, 40, 32]], ["♦", [178, 40, 32]], ["♣", [26, 26, 26]]];
    const mkCard = () => ({ x: p.random(p.width * .1, p.width * .9), y: -30,
      vx: p.random([-1, 1]) * p.random(1.2, 2.6), vy: p.random(0, 1.5),
      s: (p.random(4)) | 0, w: 34, h: 44 });
    const deal = () => { p.background(bgR, bgG, bgB); cards = [mkCard()];
      resetAt = p.frameCount + 30 * 18; };
    const stamp = (c) => { p.noStroke(); p.fill(255); p.rect(c.x, c.y, c.w, c.h, 3);
      p.stroke(150); p.noFill(); p.rect(c.x, c.y, c.w, c.h, 3); p.noStroke();
      const [ch, col] = SUITS[c.s]; p.fill(col[0], col[1], col[2]);
      p.textSize(15); p.textAlign(p.CENTER, p.CENTER);
      p.text(ch, c.x + c.w / 2, c.y + c.h / 2); };
    p.setup = () => { const [w, h] = dims(container); p.createCanvas(w, h).parent(container);
      p.pixelDensity(1); p.frameRate(30); deal();
      if (REDUCED) { const c = cards[0];               // pre-simulate one arc
        for (let i = 0; i < 90; i++) { stamp(c); c.x += c.vx; c.y += c.vy; c.vy += .35;
          if (c.y + c.h > p.height) { c.y = p.height - c.h; c.vy *= -.82; } }
        p.noLoop(); } };
    p.draw = () => {                                   // NO background — trails
      if (p.frameCount > resetAt) deal();
      for (const c of cards) { stamp(c); c.x += c.vx; c.y += c.vy; c.vy += .35;
        if (c.y + c.h > p.height) { c.y = p.height - c.h; c.vy *= -.82; } }
      cards = cards.filter(c => c.x > -c.w - 4 && c.x < p.width + 4);
      if (!cards.length) cards.push(mkCard()); };
    p.windowResized = () => { const [w, h] = dims(container); p.resizeCanvas(w, h); deal(); };
  };
}

// WINAMP — the classic skin's soul: a spectrum analyzer, green→amber→red bars
// with peak caps that hang then fall. It really whips the llama's ass.
function makeWinamp(pal, container) {
  const [bgR, bgG, bgB] = _hx(pal.bg);
  return (p) => {
    let bars = [], peaks = [], t = 0;
    const N = () => Math.max(18, Math.min(34, (p.width / 16) | 0));
    const level = (i, n) => {                          // pseudo-audio: layered sines
      const x = i / n;
      const v = .5 + .5 * Math.sin(t * 2.1 + x * 9) * Math.sin(t * 1.3 + x * 4.2)
        + .35 * Math.sin(t * 3.7 + x * 17) + .22 * p.noise(x * 6, t * .6);
      return p.constrain(v * .62 * (1 - x * .3), .03, 1); };
    const barColor = (f) => f < .5 ? [63, 216, 88] : f < .8 ? [216, 168, 48] : [224, 80, 56];
    const scene = (mv) => { p.background(bgR, bgG, bgB); const n = bars.length;
      const bw = p.width / n, base = p.height, maxH = p.height * .45;
      p.noStroke();
      for (let i = 0; i < n; i++) { if (mv) {
          const target = level(i, n); bars[i] += (target - bars[i]) * .3;
          if (bars[i] > peaks[i]) peaks[i] = bars[i]; else peaks[i] -= .006; }
        const h = bars[i] * maxH, segs = Math.max(1, (h / 7) | 0);
        for (let s = 0; s < segs; s++) { const f = s / (maxH / 7), c = barColor(f);
          p.fill(c[0], c[1], c[2], 230); p.rect(i * bw + 1.5, base - (s + 1) * 7 + 1, bw - 3, 5); }
        const c = barColor(peaks[i]);                  // hanging peak cap
        p.fill(c[0], c[1], c[2]); p.rect(i * bw + 1.5, base - peaks[i] * maxH - 3, bw - 3, 2.5); } };
    p.setup = () => { const [w, h] = dims(container); p.createCanvas(w, h).parent(container);
      p.pixelDensity(1); p.frameRate(30);
      bars = new Array(N()).fill(.05); peaks = new Array(N()).fill(.1);
      if (REDUCED) { t = 4; for (let k = 0; k < 30; k++) { t += .03;
          for (let i = 0; i < bars.length; i++) { const v = level(i, bars.length);
            bars[i] += (v - bars[i]) * .3; peaks[i] = Math.max(peaks[i], bars[i]); } }
        scene(false); p.noLoop(); return; } };
    p.draw = () => { t += .03; scene(true); };
    p.windowResized = () => { const [w, h] = dims(container); p.resizeCanvas(w, h);
      bars = new Array(N()).fill(.05); peaks = new Array(N()).fill(.1); };
  };
}

// ---- render ----------------------------------------------------------------
function setVars(el, d) {
  const dark = d.mode === "dark";
  const [pr, pg, pb] = _hx(d.paper);
  el.style.setProperty("--bg", d.bg);
  el.style.setProperty("--paper", d.paper);
  el.style.setProperty("--ink", d.ink);
  el.style.setProperty("--ink-soft", d.inkSoft);
  el.style.setProperty("--ink-faint", d.inkFaint);
  el.style.setProperty("--card-bg", `rgba(${pr},${pg},${pb},${dark ? .82 : .86})`);
  for (const k of ["lapis", "sanguine", "verdigris", "ochre", "plum"]) el.style.setProperty(`--${k}`, d[k]);
  el.style.setProperty("--font", d.font);
}

function sampler(d, big) {
  const dots = ["lapis", "sanguine", "verdigris", "ochre", "plum"]
    .map(k => `<span style="background:${d[k]}"></span>`).join("");
  return `<div class="ui">
    <span class="badge">${d.shipped ? "shipped" : "draft"} · ${d.mode}</span>
    <div class="samp-card">
      <div class="ttl">sample-project</div>
      <div class="ex">"a short blurb of what the project is — placeholder copy to preview the type."</div>
      <div class="btns"><button class="b-open">▷ open</button><button class="b-claude">claude ▾</button><button class="b-files">files</button></div>
    </div>
    <div class="samp-row">
      <div class="dots">${dots}</div>
      <div class="term"><span class="g">~/sample-project</span> <span class="b">$</span> <span class="f">git status</span> <span class="y">✦</span></div>
    </div>
    <div class="name" style="${big ? "" : "margin-top:.1rem"}"><b>${d.name}</b> <span>· ${d.blurb}</span></div>
  </div>`;
}

const instances = [];
function mountTile(d) {
  const tile = document.createElement("div");
  tile.className = "tile";
  if (d.shipped) tile.dataset.shipped = "1";
  setVars(tile, d);
  tile.innerHTML = sampler(d, false);
  tile.addEventListener("click", () => expand(d));
  document.getElementById("grid").appendChild(tile);
  // canvas (z-index:0) sits behind the .ui overlay (z-index:1); p5 appends its
  // canvas in setup() — DOM order doesn't matter, the z-index layering does
  requestAnimationFrame(() => instances.push(new p5(d.sketch(d, tile), tile)));
}

// expand overlay
let xInst = null;
function expand(d) {
  const x = document.getElementById("x"), big = document.getElementById("x-big");
  setVars(big, d); big.innerHTML = sampler(d, true);
  x.classList.add("on");
  requestAnimationFrame(() => { xInst = new p5(d.sketch(d, big), big); });
}
function closeX() {
  const x = document.getElementById("x");
  if (xInst) { xInst.remove(); xInst = null; }
  x.classList.remove("on");
}
document.getElementById("x-close").addEventListener("click", closeX);
document.getElementById("x").addEventListener("click", e => { if (e.target.id === "x") closeX(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeX(); });

DRAFTS.forEach(mountTile);
</script>
